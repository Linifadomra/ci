name: run
description: Run the project's own build for one target
inputs:
  service:
    default: ""
  command:
    default: ""
  env:
    default: "null"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        COMMAND: ${{ inputs.command }}
        TARGET_ENV: ${{ inputs.env }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/run.sh"
