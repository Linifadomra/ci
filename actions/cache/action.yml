name: cache
description: Select this target's sprintrunner build cache when the lane has one
inputs:
  target:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        command -v sprint-state >/dev/null || exit 0
        if grep -q sprint.state_verified=1 /proc/cmdline; then
          sprint-state attach || echo "no repo cache for this job, building cold"
        fi
        sprint-state select "$TARGET"
